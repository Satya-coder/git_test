        <br><br>
        <label for="itemUUID">Item UUID:</label>
        <input type="text" id="itemUUID" name="itemUUID" placeholder="Enter item UUID" required>
        <br><br>

        <input type="text" id="itemHash" name="itemHash" placeholder="Enter item hash" required>

</div>
