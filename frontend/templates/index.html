!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do page</title>
</head>
<body>
<div class="container">
    <h2>To-do List</h2>
<form id="todo-form" method="POST" action="/submit_todo_item">
    <label for='itemName'>Item Name:</label>
    <input type="text" id="itemName" name="itemName" placeholder="Enter item name" required>
    <label for="itemDescription">Item Description:</label>
    <input type="text" id="itemDescription" name="itemDescription" placeholder="Enter item description" required>
    <br><br>
    <button type="submit">Add Item</button>
</form>
    <div id="status-msg"></div>
</div>
</body>
</html>
